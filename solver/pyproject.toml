[project]
name = "evsolver"
version = "0.1.0"
description = "EV fleet routing solver (VRPTW + charging feasibility repair)"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]